# CI/CD di desoshare — test a ogni push, deploy automatico su main.
#
# Il prodotto gira su hosting PHP condiviso (share.deso.tech, Hostinger):
# il deploy è un rsync via SSH dei soli file dell'app verso public_html.
# Niente container/k8s in produzione — il runner serve solo a testare e copiare.
#
# Variabili CI richieste (Settings → CI/CD → Variables, progetto id 9):
#   DEPLOY_HOST        145.223.84.29
#   DEPLOY_PORT        65002
#   DEPLOY_USER        u949251708
#   DEPLOY_PATH        domains/share.deso.tech/public_html
#   SSH_KNOWN_HOSTS    output di `ssh-keyscan -p 65002 145.223.84.29`
#   DEPLOY_KEY         (File, Protected) chiave privata ed25519 autorizzata su hPanel

stages: [test, deploy]

# ─── Test ─────────────────────────────────────────────────────────────────────
# Le suite sono autocontenute (istanza isolata via `php -S`, nessun servizio
# esterno). s3_test.sh resta FUORI dalla CI: richiede credenziali Wasabi reali.

.php: &php
  image: php:8.2-cli   # stessa major/minor del server Hostinger
  stage: test
  before_script:
    # libzip-dev + ext-zip: il server ha zip abilitato (PHP 8.5); l'immagine cli no.
    # Serve a action=zip (ZipArchive) — senza, api_test.sh fallisce su "firma PK".
    - apt-get update -qq && apt-get install -yqq --no-install-recommends curl openssl ca-certificates libzip-dev > /dev/null
    - docker-php-ext-install zip > /dev/null 2>&1

lint:
  <<: *php
  script:
    - find . -name '*.php' -not -path './tests/*' -print0 | xargs -0 -n1 php -l

test:api:
  <<: *php
  script:
    - bash tests/api_test.sh

test:oidc:
  <<: *php
  script:
    - bash tests/oidc_test.sh

test:js:
  image: node:22-alpine
  stage: test
  cache:
    key: js-smoke-node-modules
    paths: [tests/node_modules/]
  script:
    - cd tests && npm install --no-audit --no-fund && node js_smoke.mjs

# Test MODEL-BASED dei cicli di vita: sequenze pseudo-casuali riproducibili di
# operazioni reali (crea/modifica/condividi/rinomina/cancella/ricrea) con
# verifica delle invarianti dopo ogni passo. Trova i bug EMERGENTI dalle
# sequenze (es. contenuti o link che "risorgono") che i test per-operazione
# non vedono. Serve node (driver) + php (app).
test:lifecycle:
  image: node:22
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -yqq --no-install-recommends php-cli > /dev/null
  script:
    - SEEDS="42 7 1234" OPS=120 node tests/lifecycle_fuzz.mjs

# ─── Deploy ───────────────────────────────────────────────────────────────────
# Copia in produzione SOLO i file dell'app (vedi tests/README.md): *.php,
# assets/, .htaccess, .user.ini, icone. Mai tests/, *-src/, docs, .git.
# Senza --delete: in public_html possono esistere file non versionati
# (es. .well-known/) che non vanno toccati.
#
# Guard OIDC: se il .htaccess di produzione contiene un SetEnv (segreto OIDC
# iniettato via env) e quello del repo no, il .htaccess NON viene sovrascritto.

deploy:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production
    url: https://share.deso.tech
  before_script:
    - apk add --no-cache openssh-client rsync curl > /dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 "$DEPLOY_KEY"
  script:
    # Staging dir con il solo set di deploy
    - mkdir dist
    - cp *.php dist/
    - cp -R assets dist/
    - cp .user.ini favicon.ico apple-touch-icon.png dist/
    - cp .htaccess dist/
    - SSH="ssh -i $DEPLOY_KEY -p $DEPLOY_PORT -o BatchMode=yes"
    # Guard: preserva un .htaccess di produzione che porta SetEnv non presente nel repo
    - |
      if $SSH "$DEPLOY_USER@$DEPLOY_HOST" "grep -q '^[[:space:]]*SetEnv' '$DEPLOY_PATH/.htaccess'" 2>/dev/null \
         && ! grep -q '^[[:space:]]*SetEnv' .htaccess; then
        echo "ATTENZIONE: .htaccess di produzione contiene SetEnv assente nel repo — non lo sovrascrivo."
        rm dist/.htaccess
      fi
    # rsync se disponibile sul server, altrimenti tar-over-ssh (stesso set di file)
    - |
      if $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'command -v rsync' >/dev/null 2>&1; then
        rsync -rlptvz -e "$SSH" dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      else
        tar czf - -C dist . | $SSH "$DEPLOY_USER@$DEPLOY_HOST" "tar xzf - -C '$DEPLOY_PATH'"
      fi
    # Smoke check post-deploy
    - sleep 2
    - curl -sfI https://share.deso.tech/index.php | head -1
